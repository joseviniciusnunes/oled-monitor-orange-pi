services:
  oled:
    # Puxa a imagem ARM v7 do GitHub Container Registry (GHCR)
    image: ghcr.io/joseviniciusnunes/oled-monitor-orange-pi:latest
    container_name: oled
    restart: always
    # Passa o barramento I2C do host para dentro do container.
    # Ajuste o número do barramento conforme o seu Orange Pi
    # (ex.: /dev/i2c-1, /dev/i2c-2, ...).
    devices:
      - /dev/i2c-1:/dev/i2c-1
    # Permissões necessárias para acessar o dispositivo I2C.
    privileged: true
    # Compartilha o namespace de PID do host para que o comando de reboot
    # (via nsenter -t 1) reinicie o HOST e não apenas o container.
    pid: host
    # Compartilha o namespace de rede do host para que o IP exibido
    # seja o IP real da placa (e não o do container).
    network_mode: host
    # Monta o sysfs do host: disco real (em /), socket do Docker (contagem
    # de containers) e o device de caracteres GPIO (botão p/ ligar/desligar).
    volumes:
      - /:/hostroot:ro
      # Mounta o socket do Docker para contar containers em execução
      - /var/run/docker.sock:/var/run/docker.sock
      # Device de caracteres GPIO para o botão (libgpiod via /dev/gpiochip0).
      # O privileged:true acima já dá acesso, mas o mount deixa explícito.
      - /dev/gpiochip0:/dev/gpiochip0:rw
